<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpDraft — Hiring Openings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#fafafa; --border:#eaeaea; --border-soft:#f0f0f0;
    --text:#111111; --text-dim:#555555; --text-faint:#999999;
    --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eff4ff;
    --green:#1f9d55; --green-bg:#e6f7ec;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --shadow-lift: 0 8px 32px rgba(0,0,0,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111113; --panel:#1a1a1d; --panel-2:#1f2023; --border:#2c2d30; --border-soft:#28292c;
      --text:#f2f2f3; --text-dim:#a8a9ac; --text-faint:#7d7e81;
      --accent:#5b8def; --accent-hover:#4776d6; --accent-soft:#1b2740;
      --green:#3fc172; --green-bg:#173225;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111113; --panel:#1a1a1d; --panel-2:#1f2023; --border:#2c2d30; --border-soft:#28292c;
    --text:#f2f2f3; --text-dim:#a8a9ac; --text-faint:#7d7e81;
    --accent:#5b8def; --accent-hover:#4776d6; --accent-soft:#1b2740;
    --green:#3fc172; --green-bg:#173225;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;}

  .brand-nav{background:#111; padding:14px 20px;}
  .brand-nav-inner{max-width:1000px; margin:0 auto; display:flex; align-items:baseline; gap:12px;}
  .brand-logo{font-family:'DM Serif Display',Georgia,serif; font-size:19px; color:#fff; letter-spacing:-0.02em;}
  .brand-tag{font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.08em; font-weight:600;}

  .wrap{max-width:1000px; margin:0 auto; padding:40px 16px 60px;}

  .eyebrow{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
  .titleblock h1{font-family:'DM Serif Display',Georgia,serif; font-size:28px; margin:0 0 8px; font-weight:400; letter-spacing:-0.02em;}
  .titleblock p{margin:0 0 24px; font-size:13.5px; color:var(--text-dim); max-width:640px; line-height:1.5;}

  .page-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
  .page-tab{
    border:1px solid var(--border); background:var(--panel); color:var(--text-dim); font-size:13px; font-weight:600;
    padding:8px 16px; border-radius:7px; cursor:pointer; transition:border-color .15s;
  }
  .page-tab:hover{border-color:#ccc;}
  .page-tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .openings-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px;}

  .opening-card{
    display:block; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px;
    text-decoration:none; color:var(--text); box-shadow:var(--shadow); transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .opening-card:hover{border-color:var(--accent); box-shadow:var(--shadow-lift); transform:translateY(-2px);}
  .oc-icon{
    width:36px; height:36px; background:var(--accent-soft); color:var(--accent); border-radius:9px;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; margin-bottom:14px;
  }
  .oc-title{font-size:15px; font-weight:700; margin-bottom:6px;}
  .oc-meta{font-size:12.5px; color:var(--text-dim);}
  .oc-meta .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-right:5px;}

  .opening-card.placeholder{
    border-style:dashed; box-shadow:none; cursor:default; color:var(--text-faint); display:flex;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:100px;
  }
  .opening-card.placeholder:hover{box-shadow:none; transform:none; border-color:var(--border);}
  .opening-card.placeholder .oc-title{color:var(--text-faint); font-weight:600;}

  .empty-state{
    padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13.5px; border:1px dashed var(--border);
    border-radius:12px;
  }

  .view[hidden]{display:none;}
</style>
</head>
<body>
<div class="brand-nav"><div class="brand-nav-inner"><span class="brand-logo">UpDraft</span><span class="brand-tag">Hiring</span></div></div>
<div class="wrap">
  <div class="titleblock">
    <div class="eyebrow">Openings</div>
    <h1>Hiring pipeline</h1>
    <p>Pick an opening to view its candidate pipeline.</p>
  </div>

  <div class="page-tabs" id="pageTabs">
    <button type="button" class="page-tab active" data-tab="available">Available</button>
    <button type="button" class="page-tab" data-tab="concluded">Concluded</button>
  </div>

  <div class="view" id="availableView">
    <div class="openings-grid">
      <a class="opening-card" href="ai-engineer.html">
        <div class="oc-icon">AI</div>
        <div class="oc-title">AI Engineer</div>
        <div class="oc-meta" id="aiEngMeta"><span class="dot"></span>Loading…</div>
      </a>
      <div class="opening-card placeholder">
        <div class="oc-title">+ New opening</div>
        <div class="oc-meta">Future roles will appear here.</div>
      </div>
    </div>
  </div>

  <div class="view" id="concludedView" hidden>
    <div class="empty-state">No concluded openings yet.</div>
  </div>
</div>

<!-- Firebase (compat SDK) — just used here to show a live candidate count on the AI Engineer tile -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script>
  (function(){
    document.querySelectorAll("#pageTabs .page-tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll("#pageTabs .page-tab").forEach(function(b){ b.classList.toggle("active", b === btn); });
        document.getElementById("availableView").hidden = btn.dataset.tab !== "available";
        document.getElementById("concludedView").hidden = btn.dataset.tab !== "concluded";
      });
    });

    var metaEl = document.getElementById("aiEngMeta");
    try {
      if (window.__firebaseReady && typeof firebase !== "undefined"){
        firebase.firestore().collection("cards").get().then(function(snap){
          metaEl.innerHTML = '<span class="dot"></span>' + snap.size + ' candidates in pipeline';
        }).catch(function(){
          metaEl.textContent = "Open pipeline";
        });
        return;
      }
    } catch(e){}
    metaEl.textContent = "Open pipeline";
  })();
</script>
</body>
</html>
